name: Download Dukascopy Tick Data

on:
  workflow_dispatch:
    inputs:
      instrument:
        description: "نماد (eurusd, gbpusd, usdjpy, xauusd, nzdusd, btcusd)"
        required: true
        default: "eurusd"
      from:
        description: "تاریخ شروع YYYY-MM-DD"
        required: true
        default: "2024-01-01"
      to:
        description: "تاریخ پایان YYYY-MM-DD (انحصاری)"
        required: true
        default: "2025-01-01"
      chunk:
        description: "اندازهٔ هر job"
        required: true
        default: "month"
        type: choice
        options: [month, year]
      timeframe:
        description: "تایم‌فریم"
        required: true
        default: "tick"
        type: choice
        options: [tick, s1, m1, m30, h1, d1]
      telegram:
        description: "ارسال لینک‌ها به تلگرام"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  # ==========================================================
  # 1) ساخت دینامیک بازه‌ها
  # ==========================================================
  prepare:
    runs-on: ubuntu-latest
    outputs:
      instrument: ${{ steps.meta.outputs.instrument }}
      instrument_upper: ${{ steps.meta.outputs.instrument_upper }}
      tag_prefix: ${{ steps.meta.outputs.tag_prefix }}
      chunk_count: ${{ steps.meta.outputs.chunk_count }}
      chunks: ${{ steps.meta.outputs.chunks }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build chunk matrix
        id: meta
        shell: bash
        env:
          RAW_INSTRUMENT: ${{ inputs.instrument }}
          RAW_FROM: ${{ inputs.from }}
          RAW_TO: ${{ inputs.to }}
          CHUNK: ${{ inputs.chunk }}
          TIMEFRAME: ${{ inputs.timeframe }}
        run: |
          set -euo pipefail
          python3 scripts/build_matrix.py | tee -a "$GITHUB_OUTPUT"

  # ==========================================================
  # 2) دانلود هر بازه در job جداگانه
  # ==========================================================
  download:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 3          # بیشتر از این، Dukascopy محدودیت اعمال می‌کند
      matrix:
        chunk: ${{ fromJson(needs.prepare.outputs.chunks) }}
    env:
      INSTRUMENT: ${{ needs.prepare.outputs.instrument }}
      INSTRUMENT_UPPER: ${{ needs.prepare.outputs.instrument_upper }}
      FROM_DATE: ${{ matrix.chunk.from }}
      TO_DATE: ${{ matrix.chunk.to }}
      TIMEFRAME: ${{ inputs.timeframe }}
      SLUG: ${{ needs.prepare.outputs.tag_prefix }}${{ matrix.chunk.from }}-to-${{ matrix.chunk.to }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost || true
          df -h /

      - name: Download ticks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p download
          echo "::group::download $SLUG"
          npx -y dukascopy-node \
            -i "$INSTRUMENT" \
            -from "$FROM_DATE" \
            -to "$TO_DATE" \
            -t "$TIMEFRAME" \
            -f csv \
            -v \
            -bs 5 \
            -bp 1500 \
            -r 5 \
            -rp 3000 \
            -dir ./download
          echo "::endgroup::"
          df -h /

      - name: Locate CSV
        shell: bash
        run: |
          set -euo pipefail
          find download -type f -print
          CSV=$(find download -type f -name "*.csv" | head -n 1)
          if [ -z "$CSV" ]; then
            echo "ERROR: هیچ فایل CSV ساخته نشد"
            exit 1
          fi
          mv "$CSV" "${SLUG}.csv"
          ls -lh "${SLUG}.csv"
          if [ "$(stat -c%s "${SLUG}.csv")" -lt 1024 ]; then
            echo "::warning::خروجی تقریباً خالی است (احتمالاً بازار در این بازه تعطیل بوده)"
          fi

      - name: Zip CSV
        shell: bash
        run: |
          set -euo pipefail
          zip -9 -j "${SLUG}.zip" "${SLUG}.csv"
          rm -f "${SLUG}.csv"
          ls -lh "${SLUG}.zip"

      - name: Split ZIP if larger than 1.9GB
        shell: bash
        run: |
          set -euo pipefail
          FILE="${SLUG}.zip"
          SIZE=$(stat -c%s "$FILE")
          LIMIT=$((1900 * 1024 * 1024))
          echo "size=$SIZE limit=$LIMIT"
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "فایل بزرگ‌تر از سقف ریلیز است — تقسیم می‌شود..."
            split -b 1900M -d -a 2 "$FILE" "${FILE}.part"
            rm -f "$FILE"
            ls -lh "${FILE}".part*
          else
            echo "نیازی به تقسیم نیست."
          fi

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.SLUG }}
          name: "${{ env.INSTRUMENT_UPPER }} ${{ inputs.timeframe }} | ${{ matrix.chunk.from }} -> ${{ matrix.chunk.to }}"
          generate_release_notes: false
          fail_on_unmatched_files: false
          files: |
            ./${{ env.SLUG }}.zip
            ./${{ env.SLUG }}.zip.part*

  # ==========================================================
  # 3) ارسال ترتیبی به تلگرام
  # ==========================================================
  notify:
    needs: [prepare, download]
    if: ${{ inputs.telegram && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send release links to Telegram
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TAG_PREFIX: ${{ needs.prepare.outputs.tag_prefix }}
          INSTRUMENT_UPPER: ${{ needs.prepare.outputs.instrument_upper }}
          TIMEFRAME: ${{ inputs.timeframe }}
          CHUNKS: ${{ needs.prepare.outputs.chunks }}
        run: python3 scripts/notify_telegram.py
